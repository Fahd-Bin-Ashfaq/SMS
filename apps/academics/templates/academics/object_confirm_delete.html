{% extends "portal/base.html" %}
{% block title %}Delete record · School Portal{% endblock %}
{% block page_heading %}Academics{% endblock %}
{% block content %}
<section>
  <h1 class="h2">Delete record</h1>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a>
  </form>
</section>
{% endblock %}
