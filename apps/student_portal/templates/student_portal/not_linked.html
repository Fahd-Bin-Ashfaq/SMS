<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account not linked</title>
  <style>
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 16px; background: #13181a; color: #e9efed; font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .box { max-width: 440px; padding: 28px; border: 1px solid #2b3638; border-radius: 18px; background: #1e2628; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #9aa8a5; }
    button { padding: 10px 18px; border: 1px solid #2b3638; border-radius: 12px; background: #242e30; color: inherit; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Your account is not linked yet</h1>
    <p>This login is not connected to an active student record. Please contact the school office.</p>
    <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">Log out</button></form>
  </div>
</body>
</html>
