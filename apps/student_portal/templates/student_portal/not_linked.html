<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account not linked</title>
  <style>
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 16px; background: #f4f7fb; color: #172033; font: 14px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .box { max-width: 440px; padding: 32px; border: 1px solid #edf0f5; border-radius: 16px; background: #fff; box-shadow: 0 12px 35px #182c4c0c; text-align: center; }
    h1 { margin: 0 0 8px; color: #1c2940; font-size: 22px; letter-spacing: -.03em; }
    p { margin: 0 0 18px; color: #78869a; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #626fe7; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #515ed5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Your account is not linked yet</h1>
    <p>This login is not connected to an active student record. Please contact the school office.</p>
    <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">Log out</button></form>
  </div>
</body>
</html>
