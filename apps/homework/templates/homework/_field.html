<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if hint %}<div class="form-text">{{ hint }}</div>{% elif field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
</div>
